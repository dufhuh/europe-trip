plugins {
    id 'com.android.application'
}

android {
    namespace 'com.insxhs.saver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.insxhs.saver'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '1.3.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
