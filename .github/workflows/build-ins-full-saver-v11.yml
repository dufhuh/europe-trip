name: Build INS Full Saver v1.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-ins-full-saver-v11
    paths:
      - 'android-build/**'
      - '.github/workflows/build-ins-full-saver-v11.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source archive
        id: source
        continue-on-error: true
        run: |
          set -o pipefail
          cat \
            android-build/part00_00.b64 \
            android-build/part00_01.b64 \
            android-build/part00_02.b64 \
            android-build/part00_03.b64 \
            android-build/part00_04.b64 \
            android-build/part00_05.b64 \
            android-build/part01.b64 \
            android-build/part02.b64 \
            android-build/part03.b64 \
            | base64 --decode > INSFullSaver-v1.1.0-source.zip
          echo '03db00a2119197a40de993c9b5a8df649394a3c7a8386a45b8ec1ee2a3766bdc  INSFullSaver-v1.1.0-source.zip' | sha256sum -c -
          unzip -q INSFullSaver-v1.1.0-source.zip

      - name: Set up Java 17
        if: steps.source.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.source.outcome == 'success'
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        if: steps.source.outcome == 'success'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        if: steps.source.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        id: android_build
        if: steps.source.outcome == 'success'
        continue-on-error: true
        working-directory: INSFullSaver
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee ../build.log

      - name: Prepare result
        if: always()
        run: |
          mkdir -p dist
          echo "source_outcome=${{ steps.source.outcome }}" > dist/build-status.txt
          echo "build_outcome=${{ steps.android_build.outcome }}" >> dist/build-status.txt
          test -f build.log && cp build.log dist/build.log || true
          if test -f INSFullSaver/app/build/outputs/apk/debug/app-debug.apk; then
            cp INSFullSaver/app/build/outputs/apk/debug/app-debug.apk dist/INSFullSaver-v1.1.0.apk
            sha256sum dist/INSFullSaver-v1.1.0.apk > dist/INSFullSaver-v1.1.0.apk.sha256
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSFullSaver-v1.1.0-build-result
          path: dist/*
          if-no-files-found: error

      - name: Publish result to build branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          git commit -m 'Publish INS Full Saver v1.1.0 build result' || exit 0
          git push
