name: Build INSDL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.4.2 padding-order fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/insxhs/saver/MainActivity.java')
          s = p.read_text()
          s = s.replace('private static final String VERSION = "1.4.1";', 'private static final String VERSION = "1.4.2";', 1)

          old = """        shell.setPadding(dp(14), dp(6), dp(14), dp(6));
        shell.setMinimumHeight(dp(60));
        shell.setBackground(insetRounded(PANEL, LINE, 30));"""
          new = """        shell.setMinimumHeight(dp(60));
        shell.setBackground(insetRounded(PANEL, LINE, 30));
        shell.setPadding(dp(14), dp(6), dp(14), dp(6));"""
          if old not in s:
              raise SystemExit('Link block not found')
          s = s.replace(old, new, 1)

          old = """            empty.setPadding(0, 0, 0, 0);
            empty.setBackground(insetRounded(PANEL, LINE, 24));"""
          new = """            empty.setBackground(insetRounded(PANEL, LINE, 24));
            empty.setPadding(0, 0, 0, 0);"""
          if old not in s:
              raise SystemExit('Empty recent block not found')
          s = s.replace(old, new, 1)

          old = """        card.setPadding(dp(18), 0, dp(18), 0);
        card.setBackground(insetRounded(PANEL, LINE, 24));"""
          new = """        card.setBackground(insetRounded(PANEL, LINE, 24));
        card.setPadding(dp(18), 0, dp(18), 0);"""
          if old not in s:
              raise SystemExit('Recent card block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          g = Path('app/build.gradle')
          t = g.read_text()
          if 'versionCode 11' not in t or "versionName '1.4.1'" not in t:
              raise SystemExit('Unexpected Gradle version')
          t = t.replace('versionCode 11', 'versionCode 12', 1)
          t = t.replace("versionName '1.4.1'", "versionName '1.4.2'", 1)
          g.write_text(t)

          r = Path('README.md')
          u = r.read_text().replace('v1.4.1', 'v1.4.2', 1)
          r.write_text(u)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Commit v1.4.2 fix
        run: |
          git config user.name "dufhuh"
          git config user.email "dufhuh44565@gmail.com"
          git add app/src/main/java/com/insxhs/saver/MainActivity.java app/build.gradle README.md
          git commit -m "Fix INSDL v1.4.2 inner padding order"
          git push origin main

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/INSDL-debug.apk
          sha256sum dist/INSDL-debug.apk > dist/INSDL-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INSDL-debug-apk
          path: dist/*
          if-no-files-found: error
