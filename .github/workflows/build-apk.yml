name: Build INS Full Saver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q INSFullSaver-source.zip

      - name: Build debug APK
        working-directory: INSFullSaver
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp INSFullSaver/app/build/outputs/apk/debug/app-debug.apk dist/INSFullSaver-debug.apk
          sha256sum dist/INSFullSaver-debug.apk > dist/INSFullSaver-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INSFullSaver-debug-apk
          path: dist/*
          if-no-files-found: error

