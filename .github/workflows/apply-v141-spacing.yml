name: Apply INSDL v1.4.1 spacing refinements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v141-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved spacing refinements
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/insxhs/saver/MainActivity.java')
          s = p.read_text()
          replacements = [
              ('private static final String VERSION = "1.4.0";', 'private static final String VERSION = "1.4.1";'),
              ('shell.setPadding(dp(8), dp(6), dp(7), dp(6));', 'shell.setPadding(dp(14), dp(6), dp(14), dp(6));'),
              ('shell.setMinimumHeight(dp(58));', 'shell.setMinimumHeight(dp(60));'),
              ('shell.setBackground(insetRounded(PANEL, LINE, 29));', 'shell.setBackground(insetRounded(PANEL, LINE, 30));'),
              ('ImageView linkIcon = circleIcon(R.drawable.ic_link, 38, 18);', 'ImageView linkIcon = circleIcon(R.drawable.ic_link, 40, 18);'),
              ('shell.addView(linkIcon, new LinearLayout.LayoutParams(dp(38), dp(38)));', 'shell.addView(linkIcon, new LinearLayout.LayoutParams(dp(40), dp(40)));'),
              ('urlInput.setPadding(dp(12), 0, dp(8), 0);', 'urlInput.setPadding(dp(14), 0, dp(10), 0);'),
              ('button.setMinimumHeight(dp(58));', 'button.setMinimumHeight(dp(60));'),
              ('Color.parseColor("#ECECE8"), 29));', 'Color.parseColor("#ECECE8"), 30));'),
              ('Color.parseColor("#D7D7D2"), 29));', 'Color.parseColor("#D7D7D2"), 30));'),
              ('states.addState(new int[]{}, insetRounded(PANEL_2, LINE, 29));', 'states.addState(new int[]{}, insetRounded(PANEL_2, LINE, 30));'),
              ('dividerParams.leftMargin = dp(14);', 'dividerParams.leftMargin = dp(18);'),
              ('dividerParams.rightMargin = dp(14);', 'dividerParams.rightMargin = dp(18);'),
              ('row.setPadding(dp(14), 0, dp(14), 0);', 'row.setPadding(dp(18), 0, dp(18), 0);'),
              ('empty.setPadding(0, dp(22), 0, dp(22));', 'empty.setPadding(0, 0, 0, 0);'),
              ('empty.setBackground(insetRounded(PANEL, LINE, 22));', 'empty.setBackground(insetRounded(PANEL, LINE, 24));'),
              ('ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n            return;', 'ViewGroup.LayoutParams.MATCH_PARENT, dp(86)));\n            return;'),
              ('card.setPadding(dp(14), dp(12), dp(14), dp(12));', 'card.setPadding(dp(18), 0, dp(18), 0);'),
              ('card.setBackground(insetRounded(PANEL, LINE, 22));', 'card.setBackground(insetRounded(PANEL, LINE, 24));'),
              ('ImageView thumbnail = circleIcon(R.drawable.ic_image, 44, 21);', 'ImageView thumbnail = circleIcon(R.drawable.ic_image, 46, 21);'),
              ('card.addView(thumbnail, new LinearLayout.LayoutParams(dp(44), dp(44)));', 'card.addView(thumbnail, new LinearLayout.LayoutParams(dp(46), dp(46)));'),
              ('detailsParams.leftMargin = dp(12);', 'detailsParams.leftMargin = dp(14);'),
              ('ImageView done = circleIcon(R.drawable.ic_check, 36, 17);', 'ImageView done = circleIcon(R.drawable.ic_check, 38, 17);'),
              ('card.addView(done, new LinearLayout.LayoutParams(dp(36), dp(36)));', 'card.addView(done, new LinearLayout.LayoutParams(dp(38), dp(38)));'),
              ('ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n    }\n\n    private void handleIntent', 'ViewGroup.LayoutParams.MATCH_PARENT, dp(86)));\n    }\n\n    private void handleIntent'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source fragment: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          g = Path('app/build.gradle')
          t = g.read_text()
          if "versionCode 10" in t:
              t = t.replace("versionCode 10", "versionCode 11", 1)
          elif "versionCode 9" in t:
              t = t.replace("versionCode 9", "versionCode 11", 1)
          else:
              raise SystemExit('Unexpected versionCode')
          if "versionName '1.4.0'" not in t:
              raise SystemExit('Unexpected versionName')
          t = t.replace("versionName '1.4.0'", "versionName '1.4.1'", 1)
          g.write_text(t)

          r = Path('README.md')
          u = r.read_text()
          if 'v1.4.0' not in u:
              raise SystemExit('README version not found')
          r.write_text(u.replace('v1.4.0', 'v1.4.1', 1))
      - name: Commit refinements
        run: |
          git config user.name "dufhuh"
          git config user.email "dufhuh44565@gmail.com"
          git add app/src/main/java/com/insxhs/saver/MainActivity.java app/build.gradle README.md
          git commit -m "Refine INSDL v1.4.1 spacing"
          git push origin main
