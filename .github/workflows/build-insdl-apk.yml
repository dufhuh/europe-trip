name: Build INSDL APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'insdl-build/**'
      - '.github/workflows/build-insdl-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project archive
        run: |
          cat insdl-build/source.b64.part* | base64 --decode > insdl-source.zip
          rm -rf INSFullSaver
          unzip -q insdl-source.zip
          sed -i 's/android:strokeLineWidth=/android:strokeWidth=/' INSFullSaver/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -f INSFullSaver/settings.gradle

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: INSFullSaver
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../insdl-build.log

      - name: Prepare artifact
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p artifact
          cp INSFullSaver/app/build/outputs/apk/debug/app-debug.apk artifact/INSDL-v1.2.0-debug.apk
          sha256sum artifact/INSDL-v1.2.0-debug.apk > artifact/INSDL-v1.2.0-debug.apk.sha256

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: INSDL-v1.2.0-debug-apk
          path: artifact/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSDL-build-log
          path: insdl-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
