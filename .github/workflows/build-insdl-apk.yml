name: Build INSDL APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'insdl-build/**'
      - '.github/workflows/build-insdl-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project archive
        run: |
          cat insdl-build/source.b64.part* | base64 --decode > insdl-source.zip
          unzip -q insdl-source.zip
          test -f INSFullSaver/settings.gradle

      - name: Build debug APK
        working-directory: INSFullSaver
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp INSFullSaver/app/build/outputs/apk/debug/app-debug.apk artifact/INSDL-v1.2.0-debug.apk
          sha256sum artifact/INSDL-v1.2.0-debug.apk > artifact/INSDL-v1.2.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INSDL-v1.2.0-debug-apk
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
