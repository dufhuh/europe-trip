plugins {
    id 'com.android.application'
}

// INSDL v1.4.3 OpenAI-style UI refinement
android {
    namespace 'com.insxhs.saver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.insxhs.saver'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '1.4.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
